name: Terraform validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate bootstrap configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialise without a backend
        run: terraform init -backend=false -input=false
        working-directory: infra/bootstrap

      - name: Validate configuration
        run: terraform validate -no-color
        working-directory: infra/bootstrap

      - name: Test bootstrap safeguards
        run: |
          infra/bootstrap/scripts/test-generate-temporary-policy.sh
          infra/bootstrap/scripts/test-migrate-state.sh
          infra/bootstrap/scripts/test-render-s3-backend.sh
          infra/bootstrap/scripts/test-verify-bootstrap-access.sh
